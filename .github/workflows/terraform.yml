name: Terraform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  TF_VERSION: 1.5.0

jobs:
  terraform-checks:
    name: Terraform Validation and Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Init
      id: init
      run: |
        cd applications/application1
        terraform init -backend=false

    - name: Terraform Validate
      id: validate
      run: |
        cd applications/application1
        terraform validate

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: latest

    - name: Init TFLint
      run: tflint --init

    - name: Run TFLint
      run: tflint --recursive

    - name: Setup tfsec
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        additional_args: --exclude-downloaded-modules

    - name: Setup Checkov
      run: pip install checkov

    - name: Run Checkov
      run: checkov -d . --framework terraform --skip-check CKV_AWS_20,CKV_AWS_57

    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `
          ## Terraform CI Results
          
          #### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
          
          <details><summary>Show Validation Output</summary>
          
          \`\`\`
          ${{ steps.validate.outputs.stdout }}
          \`\`\`
          
          </details>
          
          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-checks
    if: github.event_name == 'pull_request'
    
    strategy:
      matrix:
        environment: [dev, stg]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: |
        cd applications/application1
        terraform init -backend=false

    - name: Terraform Plan
      id: plan
      run: |
        cd applications/application1
        terraform plan -var-file="../../config/us/${{ matrix.environment }}/terraform.tfvars" -no-color
      continue-on-error: true

    - name: Comment Plan
      uses: actions/github-script@v6
      with:
        script: |
          const output = `
          ## Terraform Plan (${{ matrix.environment }})
          
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
          
          <details><summary>Show Plan</summary>
          
          \`\`\`hcl
          ${{ steps.plan.outputs.stdout }}
          \`\`\`
          
          </details>
          
          *Environment: ${{ matrix.environment }}*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })