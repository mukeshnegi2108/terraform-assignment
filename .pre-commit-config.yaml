# Pre-commit configuration
# Install with: pre-commit install

repos:
  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.5
    hooks:
      - id: terraform_fmt
        description: Format Terraform files
      - id: terraform_validate
        description: Validate Terraform files
      - id: terraform_docs
        description: Generate Terraform documentation
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
      - id: terraform_tflint
        description: Lint Terraform files
      - id: terraform_tfsec
        description: Security scan Terraform files
        args:
          - --args=--exclude-downloaded-modules

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        description: Remove trailing whitespace
      - id: end-of-file-fixer
        description: Ensure files end with newline
      - id: check-added-large-files
        description: Check for large files
        args: ['--maxkb=500']
      - id: check-case-conflict
        description: Check for case conflicts
      - id: check-merge-conflict
        description: Check for merge conflicts
      - id: check-yaml
        description: Validate YAML files
      - id: check-json
        description: Validate JSON files
      - id: mixed-line-ending
        description: Check for mixed line endings

  # Markdown checks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        description: Lint Markdown files
        args: ['--fix']